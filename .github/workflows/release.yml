name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

# Two tags pushed close together must not race for the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Provenance attestation, so a downloaded binary can be traced to this workflow.
  id-token: write
  attestations: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$manifest" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Nothing else between here and publishing gates correctness, so a red test
      # would otherwise ship.
      - name: Test
        run: cargo test --locked

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Fuse into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/muxai \
            target/aarch64-apple-darwin/release/muxai \
            target/x86_64-apple-darwin/release/muxai
          strip -x dist/muxai
          lipo -info dist/muxai
          codesign --sign - --force dist/muxai

      # The fused, stripped, signed binary is what users run. Confirm it starts and
      # reports the version this tag claims, before it is packaged.
      - name: Smoke test the artifact
        run: |
          got=$(./dist/muxai --version)
          echo "$got"
          [ "$got" = "muxai ${{ steps.version.outputs.version }}" ]

      - name: Package
        id: package
        run: |
          asset="muxai-${{ steps.version.outputs.tag }}-macos-universal.tar.gz"
          tar -czf "$asset" -C dist muxai
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.asset }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "muxai ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256"
