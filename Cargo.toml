[package]
name = "muxai"
version = "0.1.0"
edition = "2021"
description = "Grid-dashboard TUI for managing multiple coding agents across git worktrees, on top of tmux."
license = "MIT"

[[bin]]
name = "muxai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
dirs = "5"
chrono = { version = "0.4", features = ["clock"] }
terminal-light = "1.9.0"

[profile.release]
opt-level = 3
lto = true
